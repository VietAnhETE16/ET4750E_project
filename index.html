<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Karaoke</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; }
        button { background: #ff0055; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>🎤 3D Karaoke System</h2>
        <button id="startButton">Start Audio Engine</button>
        <p>Active Singer: <span id="singerDisplay">None</span></p>
        <p>Pitch: <span id="pitchDisplay">0</span> Hz</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/meyda/dist/web/meyda.min.js"></script>
    <script src="https://unpkg.com/pitchfinder/lib/pitchfinder.min.js"></script>
    
    <script src="KaraokeScene.js"></script>
    <script src="AudioEngine.js"></script>
    <script>
        // Main initialization
        const scene = new KaraokeScene();
        let engine;

        document.getElementById('startButton').addEventListener('click', async () => {
            document.getElementById('startButton').style.display = 'none';
            engine = new AudioEngine(scene);
            await engine.initialize();
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            scene.render();
            if (engine) engine.update();
        }
        animate();
    </script>
</body>
</html>
